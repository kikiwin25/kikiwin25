name: Long audio story automation

on:
  schedule:
    # One ~15-minute audio story a day, at 19:00 Marrakesh (= 18:00 UTC, UTC+1).
    # Evening = prime listening time. Uploads >15 min require the channel to be
    # verified at https://www.youtube.com/verify — do this once, by hand.
    # NOTE: GitHub scheduled workflows can drift ~15 min and are paused after
    # 60 days of repo inactivity; the daily state commits prevent that.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional story topic override (leave empty for AI choice)"
        required: false
        default: ""
      dry_run:
        description: "Generate only, do NOT upload to YouTube"
        type: boolean
        default: false

concurrency:
  group: long-story
  cancel-in-progress: false

permissions:
  contents: write   # needed to commit the state/ publish log back

jobs:
  produce:
    runs-on: ubuntu-latest   # ffmpeg + DejaVu fonts are preinstalled here
    timeout-minutes: 120     # a ~15-minute video renders far longer than a Short
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate story (and upload unless dry run)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TOPIC: ${{ github.event.inputs.topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          ARGS=()
          [ -n "$DRY_RUN" ] && ARGS+=(--dry-run)
          [ -n "$TOPIC" ] && ARGS+=(--topic "$TOPIC")
          python -m shorts.long "${ARGS[@]+${ARGS[@]}}"

      - name: Upload video artifact (downloadable from this run)
        if: always()
        continue-on-error: true   # a 15-min file is heavy; never fail the run over it
        uses: actions/upload-artifact@v4
        with:
          name: long-video
          path: outputs/**/*.mp4
          retention-days: 3
          if-no-files-found: warn

      - name: Commit publish log (state/)
        if: success()
        run: |
          git config user.name "shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "chore(state): long story publish log [skip ci]"
          git push
