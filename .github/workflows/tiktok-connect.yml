name: TikTok connect

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: "The 'code' shown on the callback page after approving"
        required: true
        type: string

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Restore TikTok tokens cache
        uses: actions/cache@v4
        with:
          path: .tiktok_token
          key: tiktok-tok-${{ github.run_id }}
          restore-keys: tiktok-tok-

      - name: Echanger le code contre les jetons
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          AUTH_CODE: ${{ github.event.inputs.auth_code }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse
          data = urllib.parse.urlencode({
              "client_key": os.environ["TIKTOK_CLIENT_KEY"],
              "client_secret": os.environ["TIKTOK_CLIENT_SECRET"],
              "grant_type": "authorization_code",
              "code": os.environ["AUTH_CODE"].strip(),
              "redirect_uri": "https://kikiwin25.github.io/kikiwin25/callback.html",
          }).encode()
          req = urllib.request.Request(
              "https://open.tiktokapis.com/v2/oauth/token/", data=data,
              headers={"Content-Type": "application/x-www-form-urlencoded"})
          tok = json.loads(urllib.request.urlopen(req, timeout=30).read().decode())
          if "access_token" not in tok:
              raise SystemExit(f"echec: {str(tok)[:300]}")
          tok["expires_at"] = time.time() + int(tok.get("expires_in", 86400)) - 600
          tok["refresh_expires_at"] = time.time() + int(tok.get("refresh_expires_in", 31536000)) - 86400
          with open(".tiktok_token", "w") as f:
              f.write(json.dumps(tok))
          print("JETONS OBTENUS — expire:", time.strftime('%Y-%m-%d %H:%M UTC', time.gmtime(tok["expires_at"])))
          print("C est fait ! Les prochains crons deposent aussi sur TikTok (en prive).")
          PY

      - name: Resultat
        run: ls -la .tiktok_token && echo "Jetons bien dans le cache prive des Actions."
