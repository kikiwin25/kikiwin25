name: Pipeline self-test

# Renders a complete short with canned data (beeps + gradient backgrounds) —
# no API keys, no upload. Use it to verify the render stack any time.
#   Actions tab -> "Pipeline self-test" -> Run workflow

on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render self-test video
        run: python -m shorts.run --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: selftest-video
          path: outputs/**/*.mp4
          retention-days: 7
